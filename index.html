<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Drill — Multi-Subject Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" id="hljsLight">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljsDark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { mono: ['"IBM Plex Mono"', 'monospace'], sans: ['Inter', 'sans-serif'] }
  } } }
</script>
<style>
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface2: #F6F7F9; --line: #E4E7EC;
    --ink: #14181F; --mute: #68707C; --accent: #B45309; --accentSoft: #FEF3E2;
    --done: #15803D; --doneSoft: #EAF7EE; --danger: #DC2626;
  }
  html.dark {
    --bg: #0B1120; --surface: #121B2E; --surface2: #0F1729; --line: #223049;
    --ink: #E8EAED; --mute: #8B98AE; --accent: #FFB000; --accentSoft: rgba(255,176,0,0.12);
    --done: #4ADE80; --doneSoft: rgba(74,222,128,0.12); --danger: #F87171;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  body { background-color: var(--bg); color: var(--ink); transition: background-color .25s, color .25s; }
  .bg-app{background-color:var(--bg);} .bg-surface{background-color:var(--surface);}
  .bg-surface2{background-color:var(--surface2);} .border-app{border-color:var(--line);}
  .text-app{color:var(--ink);} .text-mute{color:var(--mute);} .text-accent{color:var(--accent);}
  .bg-accent{background-color:var(--accent);} .bg-accent-soft{background-color:var(--accentSoft);}
  .border-accent{border-color:var(--accent);} .text-success{color:var(--done);}
  .border-success{border-color:var(--done);} .bg-success-soft{background-color:var(--doneSoft);}
  .text-danger{color:var(--danger);}

  .dot { animation: flicker 5s infinite; }
  @keyframes flicker { 0%,96%,100%{opacity:1;} 97%{opacity:.5;} 98%{opacity:1;} }
  .cursor-blink::after{content:'';display:inline-block;width:.5em;height:1em;background:var(--accent);margin-left:4px;vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  pre code.hljs{background:transparent !important;padding:0 !important;font-size:.8rem;line-height:1.65;}
  .code-shell{background:var(--surface2);border:1px solid var(--line);}

  .flip-card{perspective:1000px;}
  .flip-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .flip-back{transform:rotateY(180deg);}

  @media (prefers-reduced-motion: reduce){.dot,.cursor-blink::after,.flip-inner{animation:none !important;transition:none !important;}}

  .side-item.active{background:var(--accentSoft);border-color:var(--accent);}
  .side-item.is-done .num-badge{background:var(--doneSoft);border-color:var(--done);color:var(--done);}
  .subject-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  input:focus, button:focus, select:focus{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body class="min-h-screen font-sans">

<div id="boot" class="fixed inset-0 z-50 bg-app flex items-center justify-center font-mono text-accent">
  <p class="text-sm sm:text-base tracking-wide">&gt; initializing interview_prep.exe<span class="cursor-blink"></span></p>
</div>

<div id="appRoot" class="opacity-0 transition-opacity duration-500">

  <header class="border-b border-app bg-app/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center gap-3 justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-accent dot"></span>
        <h1 class="font-mono font-semibold text-sm sm:text-base tracking-tight">
          REEHAN<span class="text-mute">_</span>PREP<span class="text-accent">.exe</span>
        </h1>
        <span class="hidden lg:inline text-xs text-mute font-mono ml-2">Multi-subject interview question bank</span>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button id="themeToggle" class="w-9 h-9 shrink-0 rounded-lg border border-app hover:border-accent flex items-center justify-center text-sm transition-colors" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="h-1 bg-app w-full border-t border-app/0">
      <div id="progressBar" class="h-1 bg-accent transition-all duration-500" style="width:0%"></div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 md:grid-cols-[280px_1fr] gap-6">

    <aside class="md:sticky md:top-[92px] md:self-start md:max-h-[calc(100vh-104px)] md:overflow-y-auto">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-2 gap-1.5 mb-4 font-mono text-[11px] sm:text-xs" id="subjectTabs"></div>

      <div class="relative mb-3">
        <input id="searchBox" type="text" placeholder="Search problems…" class="w-full bg-surface border border-app rounded-lg pl-3 pr-3 py-2 text-sm placeholder:text-mute focus:border-accent transition-colors">
      </div>

      <p class="text-[11px] uppercase tracking-widest text-mute font-mono mb-2 px-1">Progress: <span id="progressText" class="text-accent">0 / 0</span></p>

      <nav id="questionList" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-2 md:pb-0"></nav>
    </aside>

    <main id="mainPanel" class="min-w-0"></main>

  </div>

  <footer class="max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-4 text-center text-xs text-mute font-mono">
    &gt; general practice bank — kisi bhi interview ke liye use karo.
  </footer>
</div>

<script>
/* ============================= DATA ============================= */
const SUBJECTS = [
  { id: 'node', label: 'Node.js' },
  { id: 'react', label: 'React.js' },
  { id: 'js', label: 'JavaScript' },
  { id: 'python', label: 'Python' },
  { id: 'java', label: 'Java' },
  { id: 'sql', label: 'SQL' },
  { id: 'sheet', label: 'Cheat Sheet' },
];

const nodeQuestions = [
{title:'Remove Duplicates from an Array',problem:'Given an array with repeated values, return a new array with only unique values.',code:`function removeDuplicates(arr) {
  return [...new Set(arr)];
}
console.log(removeDuplicates([1,2,2,3,3,4])); // [1,2,3,4]`,notes:'Set stores only unique values; spread turns it back into an array.'},
{title:'Word Frequency Count',problem:'Count how many times each word appears in a sentence.',code:`function wordCount(str) {
  const words = str.toLowerCase().split(' ');
  const count = {};
  for (const w of words) count[w] = (count[w] || 0) + 1;
  return count;
}
console.log(wordCount('the cat sat on the mat'));`,notes:'(count[w] || 0) + 1 handles the first-time-seen case.'},
{title:'Palindrome Check',problem:'Check if a string reads the same forwards and backwards.',code:`function isPalindrome(str) {
  const clean = str.toLowerCase().replace(/[^a-z0-9]/g, '');
  return clean === clean.split('').reverse().join('');
}
console.log(isPalindrome('A man a plan a canal Panama')); // true`,notes:'Strip non-alphanumeric characters before comparing.'},
{title:'Reverse a String',problem:'Reverse "hello" to "olleh".',code:`function reverseString(str) {
  return str.split('').reverse().join('');
}
console.log(reverseString('hello')); // olleh`,notes:'split → reverse → join is the standard one-liner.'},
{title:'Async/Await — Fetch User',problem:'Fetch user data and handle errors with try/catch.',code:`async function getUser() {
  try {
    const response = await fetch('https://api.example.com/user');
    const data = await response.json();
    console.log(data);
  } catch (error) {
    console.log('Error:', error);
  }
}`,notes:'await pauses until the Promise resolves; always wrap in try/catch.'},
{title:'Promise — Delayed Data',problem:'Return "Data received" after a 2 second delay.',code:`function getData() {
  return new Promise((resolve) => {
    setTimeout(() => resolve('Data received'), 2000);
  });
}
getData().then((data) => console.log(data));`,notes:'resolve() = success path, reject() = error path.'},
{title:'Callback Pattern',problem:'Run a second function only after the first finishes.',code:`function getUser(callback) {
  setTimeout(() => callback('User found'), 1000);
}
getUser((message) => console.log(message));`,notes:'A callback is a function passed as an argument and invoked later.'},
{title:'Sequential vs Parallel Async Calls',problem:'Show the difference between two async calls run one-after-another vs together.',code:`async function sequential() {
  const a = await fetchData('a');
  const b = await fetchData('b');
  return [a, b];
}
async function parallel() {
  const [a, b] = await Promise.all([fetchData('a'), fetchData('b')]);
  return [a, b];
}`,notes:'Promise.all() runs independent calls together, cutting total wait time.'},
{title:'Express — GET Route',problem:'Build a /users route that returns a list as JSON.',code:`const express = require('express');
const app = express();
app.get('/users', (req, res) => {
  res.json([{ id: 1, name: 'Reehan' }, { id: 2, name: 'Rahul' }]);
});
app.listen(3000);`,notes:'app.get/post/put/delete map directly to HTTP methods.'},
{title:'Express — POST Route',problem:'Create a user from the request body.',code:`app.use(express.json());
app.post('/users', (req, res) => {
  const user = req.body;
  res.status(201).json({ message: 'User created', user });
});`,notes:'express.json() is required to read a JSON request body.'},
{title:'Middleware — Request Logger',problem:'Log the method and URL of every incoming request.',code:`const logger = (req, res, next) => {
  console.log(req.method, req.url);
  next();
};
app.use(logger);`,notes:'Forgetting next() hangs the request forever.'},
{title:'Error Handling in a Route',problem:'Catch and respond to an error inside a route.',code:`app.get('/user', async (req, res) => {
  try {
    throw new Error('User not found');
  } catch (error) {
    res.status(500).json({ message: error.message });
  }
});`,notes:'Never let an error crash the server silently.'},
{title:'req.params vs req.query vs req.body',problem:'Get a user ID from the URL /users/25.',code:`app.get('/users/:id', (req, res) => {
  res.json({ userId: req.params.id });
});
// params → URL path, query → ?key=value, body → POST/PUT data`,notes:'One of the most commonly asked Node questions.'},
{title:'JWT — Generate a Token',problem:'Generate a signed JWT after login.',code:`const jwt = require('jsonwebtoken');
const token = jwt.sign({ userId: 123 }, process.env.JWT_SECRET, { expiresIn: '1h' });
console.log(token);`,notes:'sign() creates a token, verify() checks one. Never hardcode the secret.'},
{title:'Filter Even Numbers',problem:'Return only the even numbers from an array.',code:`const numbers = [1,2,3,4,5,6];
console.log(numbers.filter(n => n % 2 === 0)); // [2,4,6]`,notes:'filter() keeps elements where the callback returns true.'},
{title:'Filter Objects by Condition',problem:'Return users older than 18.',code:`const users = [{name:'A',age:15},{name:'B',age:22},{name:'C',age:30}];
console.log(users.filter(u => u.age > 18));`,notes:'Same filter() pattern applied to a property.'},
{title:'Event Loop — Why This Order?',problem:'Explain why sync code, microtasks, and macrotasks log in a specific order.',code:`console.log('1');
setTimeout(() => console.log('2'), 0);
Promise.resolve().then(() => console.log('3'));
console.log('4');
// Output: 1, 4, 3, 2`,notes:'Sync first, then microtasks (Promises), then macrotasks (setTimeout).'},
{title:'let vs const vs var',problem:'Explain scoping differences and why var causes loop bugs.',code:`for (var i=0;i<3;i++) setTimeout(()=>console.log(i),100); // 3,3,3
for (let j=0;j<3;j++) setTimeout(()=>console.log(j),100); // 0,1,2`,notes:'var is function-scoped and shared; let is block-scoped, one per iteration.'},
{title:'== vs ===',problem:'Explain loose vs strict equality.',code:`console.log(1 == '1');  // true
console.log(1 === '1'); // false`,notes:'Always prefer === to avoid type-coercion surprises.'},
{title:'Closures',problem:'Write a counter function that remembers its own count.',code:`function createCounter() {
  let count = 0;
  return function () { return ++count; };
}
const counter = createCounter();
console.log(counter(), counter()); // 1 2`,notes:'A closure remembers variables from its creation scope, even after that scope ends.'},
{title:'Higher-Order Functions',problem:'Write a function that applies another function to every array element.',code:`function applyToAll(arr, fn) { return arr.map(fn); }
console.log(applyToAll([1,2,3], n => n*2)); // [2,4,6]`,notes:'A function that takes/returns another function. map/filter/reduce are built-in examples.'},
{title:'Array reduce() — Sum of Values',problem:'Sum all numbers in an array.',code:`const numbers = [1,2,3,4,5];
console.log(numbers.reduce((sum,n) => sum+n, 0)); // 15`,notes:'reduce(callback, initialValue) carries an accumulator across each element.'},
{title:'Debounce Function',problem:'Delay running a function until the user stops triggering it.',code:`function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}`,notes:'Common for search boxes — avoids an API call on every keystroke.'},
{title:'Deep Clone an Object',problem:'Copy a nested object without sharing references.',code:`const original = { name:'Reehan', address:{city:'Belagavi'} };
const deep = JSON.parse(JSON.stringify(original));
const deep2 = structuredClone(original);`,notes:'Spread only copies one level deep; JSON trick or structuredClone() go all the way.'},
{title:'CommonJS — module.exports / require',problem:'Export a function and import it elsewhere.',code:`// math.js
module.exports = { add: (a,b) => a+b };
// app.js
const { add } = require('./math');
console.log(add(2,3)); // 5`,notes:"Node's original module system."},
{title:'Read a File (fs module)',problem:'Read a text file asynchronously.',code:`const fs = require('fs');
fs.readFile('data.txt', 'utf8', (err, data) => {
  if (err) return console.log('Error:', err);
  console.log(data);
});`,notes:'Non-blocking — the rest of the server keeps running while the file is read.'},
{title:'Environment Variables (dotenv)',problem:'Keep secrets out of source code.',code:`require('dotenv').config();
const port = process.env.PORT;`,notes:'Never commit a .env file — add it to .gitignore.'},
{title:'Enable CORS in Express',problem:'Allow a frontend on a different origin to call the API.',code:`const cors = require('cors');
app.use(cors());`,notes:'Without CORS, browsers block cross-origin requests by default.'},
{title:'PUT vs PATCH',problem:'Explain the difference between the two HTTP methods.',code:`app.put('/users/:id', (req,res) => { /* replaces whole resource */ });
app.patch('/users/:id', (req,res) => { /* updates part of it */ });`,notes:'PUT = full replace. PATCH = partial update.'},
{title:'Flatten a Nested Array',problem:'Turn [1,[2,3],[4,[5,6]]] into a flat array.',code:`const nested = [1,[2,3],[4,[5,6]]];
console.log(nested.flat(Infinity)); // [1,2,3,4,5,6]`,notes:'flat(Infinity) flattens no matter how deeply nested.'},
{title:'Sort an Array of Objects',problem:'Sort users by age, youngest first.',code:`const users=[{name:'A',age:30},{name:'B',age:15}];
users.sort((a,b) => a.age - b.age);`,notes:'Negative return → a first; positive → b first.'},
{title:'Spread vs Rest Operator',problem:'Explain the difference between ... used to spread and ... used to collect.',code:`// Spread — expands an array
const combined = [...[1,2], ...[3,4]]; // [1,2,3,4]
// Rest — collects arguments into an array
function sum(...nums) { return nums.reduce((a,b)=>a+b,0); }
console.log(sum(1,2,3)); // 6`,notes:'Same syntax, opposite direction — spread expands, rest collects.'},
{title:'Array.find() — First Match',problem:'Find the first user with a given id.',code:`const users=[{id:1,name:'A'},{id:2,name:'B'}];
const user = users.find(u => u.id === 2);
console.log(user); // { id: 2, name: 'B' }`,notes:'find() returns the first matching element (or undefined), unlike filter() which returns all matches.'},
{title:'Promise.allSettled vs Promise.all',problem:'Handle multiple promises where some might fail.',code:`Promise.all([p1, p2]).catch(e => console.log('one failed, all rejected'));

Promise.allSettled([p1, p2]).then(results => {
  results.forEach(r => console.log(r.status)); // 'fulfilled' or 'rejected'
});`,notes:'Promise.all rejects fully if one fails; allSettled always resolves and reports each outcome.'},
{title:'Node.js Streams — Read a Large File',problem:'Read a large file without loading it entirely into memory.',code:`const fs = require('fs');
const stream = fs.createReadStream('bigfile.txt', 'utf8');
stream.on('data', (chunk) => console.log('chunk:', chunk.length));
stream.on('end', () => console.log('done'));`,notes:'Streams process data in chunks — essential for large files or video, avoiding memory overload.'},
{title:'Global vs Local Scope',problem:'Explain the difference and a common bug it causes.',code:`let count = 0; // global

function increment() {
  let count = 0; // local — shadows the global one
  count++;
  console.log(count); // 1, not affecting the outer count
}
increment();
console.log(count); // still 0`,notes:'A local variable with the same name shadows the outer one inside its scope.'},
];

const reactQuestions = [
{title:'Basic Component + Props',problem:'Create a component that greets a user by name.',code:`function App() { return <User name="Reehan" />; }
function User({ name }) { return <h1>Hello {name}</h1>; }`,notes:'Props flow one direction: parent → child.'},
{title:'useState — Counter',problem:'Build a counter with increment/decrement buttons.',code:`import { useState } from 'react';
function Counter() {
  const [count, setCount] = useState(0);
  return (
    <>
      <p>{count}</p>
      <button onClick={() => setCount(count + 1)}>+</button>
      <button onClick={() => setCount(count - 1)}>-</button>
    </>
  );
}`,notes:'setCount is the only correct way to update state and trigger a re-render.'},
{title:'Controlled Form Input',problem:'Keep a text input in sync with state.',code:`const [name, setName] = useState('');
<input value={name} onChange={(e) => setName(e.target.value)} />`,notes:'React state — not the DOM — is the single source of truth.'},
{title:'Form Submit Handling',problem:'Take a username from an input and log it on submit.',code:`const handleSubmit = (e) => {
  e.preventDefault();
  console.log(name);
};
<form onSubmit={handleSubmit}>
  <input value={name} onChange={(e) => setName(e.target.value)} />
  <button type="submit">Submit</button>
</form>`,notes:'e.preventDefault() stops the default page reload.'},
{title:'List Rendering with Key',problem:'Render a list of products.',code:`const products = [{id:1,name:'Laptop'},{id:2,name:'Phone'}];
products.map(p => <p key={p.id}>{p.name}</p>);`,notes:'key must be unique and stable — use an id, not the array index if order can change.'},
{title:'Search / Filter a List',problem:'Filter a list live as the user types.',code:`const [query, setQuery] = useState('');
const filtered = items.filter(i => i.toLowerCase().includes(query.toLowerCase()));`,notes:'Every keystroke updates query, which re-runs filter() on render.'},
{title:'useEffect — Fetch on Mount',problem:'Call an API once when the component first loads.',code:`useEffect(() => {
  fetch('/api/users').then(res => res.json()).then(data => console.log(data));
}, []);`,notes:'An empty dependency array [] runs the effect once, after the first render.'},
{title:'API Fetch + Display List',problem:'Fetch users and render them with a loading state.',code:`const [users, setUsers] = useState([]);
const [loading, setLoading] = useState(true);
useEffect(() => {
  fetch('/api/users').then(r=>r.json()).then(d=>{ setUsers(d); setLoading(false); });
}, []);
if (loading) return <p>Loading...</p>;`,notes:'The single most common React interview pattern: useState + useEffect + map().'},
{title:'Event Handling',problem:'Show a message when a button is clicked.',code:`const handleClick = () => alert('Clicked');
<button onClick={handleClick}>Click</button>
// Wrong: onClick={handleClick()} — runs immediately on render`,notes:'Pass the function reference, not the result of calling it.'},
{title:'Conditional Rendering',problem:'Show Dashboard if logged in, else show Login.',code:`{isLoggedIn ? <h1>Dashboard</h1> : <h1>Please Login</h1>}`,notes:'Ternary is the standard way to branch inside JSX.'},
{title:'useMemo — Performance',problem:'Avoid re-running an expensive calculation every render.',code:`const result = useMemo(() => expensiveCalculation(value), [value]);`,notes:'Only recalculates when a dependency actually changes.'},
{title:'useRef — Focus an Input',problem:'Focus a text input on button click.',code:`const inputRef = useRef(null);
<input ref={inputRef} />
<button onClick={() => inputRef.current.focus()}>Focus</button>`,notes:'useRef gives direct DOM access without causing a re-render.'},
{title:'useContext — Avoid Prop Drilling',problem:'Share a theme value with deeply nested components.',code:`const ThemeContext = createContext('light');
<ThemeContext.Provider value="dark"><Toolbar /></ThemeContext.Provider>

function Toolbar() {
  const theme = useContext(ThemeContext);
  return <p>{theme}</p>;
}`,notes:'Avoids passing a prop through layers that do not need it themselves.'},
{title:'Custom Hook — useFetch',problem:'Extract repeated fetch logic into a reusable hook.',code:`function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    fetch(url).then(r=>r.json()).then(d=>{ setData(d); setLoading(false); });
  }, [url]);
  return { data, loading };
}`,notes:'Any function starting with "use" that reuses stateful logic is a custom hook.'},
{title:'useReducer — Complex State',problem:'Manage state with multiple related actions.',code:`function reducer(state, action) {
  switch (action.type) {
    case 'increment': return { count: state.count + 1 };
    default: return state;
  }
}
const [state, dispatch] = useReducer(reducer, { count: 0 });`,notes:'Prefer useReducer when state logic gets complex or depends on the previous state.'},
{title:'Lifting State Up',problem:'Keep two sibling components in sync.',code:`function Parent() {
  const [value, setValue] = useState('');
  return (
    <>
      <InputBox value={value} onChange={setValue} />
      <Preview value={value} />
    </>
  );
}`,notes:'Move shared state to the closest common parent and pass it down as props.'},
{title:'React.memo — Skip Re-renders',problem:'Prevent a child from re-rendering when props are unchanged.',code:`const Card = React.memo(function Card({ name }) {
  return <div>{name}</div>;
});`,notes:'React.memo shallow-compares props and skips re-rendering if nothing changed.'},
{title:'Debounced Search Input',problem:'Wait until typing stops before calling search.',code:`useEffect(() => {
  const timer = setTimeout(() => search(query), 500);
  return () => clearTimeout(timer);
}, [query]);`,notes:'The cleanup function cancels the previous timer on every keystroke.'},
{title:'Error Boundary',problem:'Catch a render error so the app does not fully crash.',code:`class ErrorBoundary extends React.Component {
  state = { hasError: false };
  static getDerivedStateFromError() { return { hasError: true }; }
  render() {
    if (this.state.hasError) return <h2>Something went wrong.</h2>;
    return this.props.children;
  }
}`,notes:'Must be a class component — no hook equivalent exists yet.'},
{title:'Conditional className',problem:'Apply an "active" class only when a condition is true.',code:`<button className={\`tab \${isActive ? 'tab-active' : ''}\`}>{label}</button>`,notes:'Template literals build conditional class strings without a library.'},
{title:'React.lazy + Suspense',problem:'Load a heavy component only when needed.',code:`const Settings = lazy(() => import('./Settings'));

const sqlQuestions = [

/* ============================= THEME ============================= */
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('themeToggle').textContent = dark ? '☀️' : '🌙';
  document.getElementById('hljsDark').disabled = !dark;
  document.getElementById('hljsLight').disabled = dark;
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(prefersDark);
document.getElementById('themeToggle').addEventListener('click', () => {

});

    document.getElementById('boot').style.transition = 'opacity 0.4s';

/* ============================= HELPERS ============================= */
function activeList() {
  const list = DATA[currentView] || [];
  if (!searchTerm) return list;
  return list.filter(q => q.title.toLowerCase().includes(searchTerm) || q.problem.toLowerCase().includes(searchTerm));
}
function qKey(view, idx) { return view + '-' + idx; }
function totalCount() { return Object.values(DATA).reduce((sum, arr) => sum + arr.length, 0); }
function updateProgress() {
  const total = totalCount();
  const done = doneSet.size;
  document.getElementById('progressText').textContent = done + ' / ' + total;
  document.getElementById('progressBar').style.width = (total ? (done / total) * 100 : 0) + '%';
}

function renderTabs() {
  const wrap = document.getElementById('subjectTabs');
  wrap.innerHTML = '';
  SUBJECTS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'subject-tab px-2 py-2 rounded-lg border border-app bg-surface hover:border-accent transition-colors' + (currentView === s.id ? ' active' : '');
    btn.textContent = s.label;
    btn.addEventListener('click', () => {
      currentView = s.id;
      currentIndex = 0;
      searchTerm = '';

      renderList();

    wrap.appendChild(btn);

/* ============================= RENDER: SIDEBAR ============================= */
function renderList() {
  const nav = document.getElementById('questionList');
  nav.innerHTML = '';

  if (currentView === 'sheet') {
    nav.innerHTML = '<p class="text-xs text-mute font-mono px-1 leading-relaxed">Quick revision — pick a subject below to filter terms.</p>';
    return;
  }

  const list = activeList();
  const fullList = DATA[currentView];

  if (list.length === 0) {
    nav.innerHTML = '<p class="text-sm text-mute font-mono px-1">No matches.</p>';
    return;
  }

  list.forEach((q) => {
    const realIdx = fullList.indexOf(q);
    const key = qKey(currentView, realIdx);
    const isDone = doneSet.has(key);
    const isActive = realIdx === currentIndex;

    const item = document.createElement('button');
    item.className = 'side-item shrink-0 md:w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-app bg-surface hover:border-accent transition-colors' + (isActive ? ' active' : '') + (isDone ? ' is-done' : '');
    item.innerHTML = `
      <span class="num-badge shrink-0 w-6 h-6 rounded flex items-center justify-center text-[11px] font-mono font-semibold border border-app text-mute">${isDone ? '✓' : String(realIdx + 1).padStart(2, '0')}</span>

    `;
    item.addEventListener('click', () => {
      currentIndex = realIdx;
      renderList();
      renderMain();
    });
    nav.appendChild(item);
  });
}

          <div class="flex items-center justify-between px-4 py-2 border-b border-app">
            <span class="text-[11px] font-mono text-mute">solution</span>
            <button id="copyBtn" class="text-[11px] font-mono text-mute hover:text-accent transition-colors">Copy</button>
          </div>
          <pre class="p-4 overflow-x-auto"><code class="language-javascript" id="codeBlock"></code></pre>
        </div>
        <div class="mt-3 flex gap-2.5 bg-accent-soft border border-accent/25 rounded-lg px-4 py-3">
          <span class="text-accent font-mono text-xs shrink-0 mt-0.5">note</span>
          <p class="text-xs sm:text-[13px] text-app/70 leading-relaxed">${q.notes}</p>
        </div>
      </div>

      <div class="flex items-center justify-between mt-6 pt-5 border-t border-app">
        <button id="prevBtn" class="font-mono text-xs px-3 py-2 rounded-lg border border-app text-mute hover:text-app hover:border-accent/50 transition-colors disabled:opacity-30" ${currentIndex === 0 ? 'disabled' : ''}>&larr; Prev</button>
        <span class="font-mono text-xs text-mute">${currentIndex + 1} of ${fullList.length}</span>
        <button id="nextBtn" class="font-mono text-xs px-3 py-2 rounded-lg border border-app text-mute hover:text-app hover:border-accent/50 transition-colors disabled:opacity-30" ${currentIndex === fullList.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
      </div>
    </div>
  `;

  document.getElementById('codeBlock').textContent = q.code;

  document.getElementById('revealBtn').addEventListener('click', () => {
    document.getElementById('answerBlock').classList.toggle('hidden');
    hljs.highlightElement(document.getElementById('codeBlock'));
  });
  document.getElementById('copyBtn').addEventListener('click', (e) => {
    navigator.clipboard.writeText(q.code);
    e.target.textContent = 'Copied!';
    setTimeout(() => { e.target.textContent = 'Copy'; }, 1200);
  });
  document.getElementById('doneToggle').addEventListener('click', () => {
    if (doneSet.has(key)) doneSet.delete(key); else doneSet.add(key);
    updateProgress(); renderList(); renderMain();
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; renderList(); renderMain(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < fullList.length - 1) { currentIndex++; renderList(); renderMain(); }
  });
}

function renderSheet(main) {
  const filters = ['all', ...Object.keys(cheatSheet)];
  main.innerHTML = `
    <div class="mb-5">
      <p class="font-mono text-xs text-accent tracking-widest mb-1.5">CHEAT SHEET</p>
      <h2 class="text-lg sm:text-xl font-semibold text-app mb-4">Last-minute revision — tap a card to flip</h2>
      <div class="flex flex-wrap gap-1.5 font-mono text-xs" id="sheetFilters"></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5" id="sheetGrid"></div>
  `;

  const filterWrap = document.getElementById('sheetFilters');
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'chip px-3 py-1.5 rounded-full border border-app bg-surface hover:border-accent transition-colors' + (sheetFilter === f ? ' active' : '');
    btn.textContent = f === 'all' ? 'All' : CATEGORY_LABEL[f];
    btn.addEventListener('click', () => { sheetFilter = f; renderSheet(main); });
    filterWrap.appendChild(btn);
  });

  const grid = document.getElementById('sheetGrid');
  const entries = sheetFilter === 'all'
    ? Object.entries(cheatSheet).flatMap(([cat, items]) => items.map(item => [cat, ...item]))
    : (cheatSheet[sheetFilter] || []).map(item => [sheetFilter, ...item]);

  entries.forEach(([cat, term, def]) => {
    const card = document.createElement('div');
    card.className = 'flip-card h-28 cursor-pointer';
    card.innerHTML = `
      <div class="flip-inner w-full h-full">
        <div class="flip-face absolute inset-0 bg-surface border border-app rounded-xl flex flex-col items-center justify-center px-4 shadow-sm">
          <span class="text-[10px] font-mono text-mute uppercase tracking-widest mb-1">${CATEGORY_LABEL[cat]}</span>
          <p class="font-mono text-sm font-semibold text-app text-center">${term}</p>
        </div>
        <div class="flip-face flip-back absolute inset-0 bg-accent-soft border border-accent/30 rounded-xl flex items-center justify-center px-4">
          <p class="text-xs text-app/70 text-center leading-relaxed">${def}</p>
        </div>
      </div>
    `;
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    grid.appendChild(card);
  });
}

/* ============================= SEARCH ============================= */
document.getElementById('searchBox').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase();
  renderList();
});

/* ============================= TIMER ============================= */
let timeLeft = 900, timerInterval = null, timerRunning = false;
function formatTime(s) { const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=(s%60).toString().padStart(2,'0'); return m+':'+sec; }
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timeLeft);
  el.classList.toggle('text-danger', timeLeft <= 60);
  el.classList.toggle('text-accent', timeLeft > 60);
}
document.getElementById('timerToggle').addEventListener('click', (e) => {
  timerRunning = !timerRunning;
  e.target.textContent = timerRunning ? 'Pause' : 'Start';
  if (timerRunning) {
    timerInterval = setInterval(() => {
      if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); }
      else {
        clearInterval(timerInterval); timerRunning = false;
        document.getElementById('timerToggle').textContent = 'Start';
        document.getElementById('timerDisplay').textContent = "Time's up";
      }
    }, 1000);
  } else clearInterval(timerInterval);
});
document.getElementById('timerReset').addEventListener('click', () => {
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
  timeLeft = parseInt(document.getElementById('timerSelect').value, 10);
  updateTimerDisplay();
});
document.getElementById('timerSelect').addEventListener('change', (e) => {
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
  timeLeft = parseInt(e.target.value, 10);
  updateTimerDisplay();
});

/* ============================= INIT ============================= */
renderTabs();
renderList();
renderMain();
updateProgress();
updateTimerDisplay();
</script>
