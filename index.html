<script>
/* ============ DATA ============ */
const nodeQuestions = [
  {
    title: 'Remove Duplicates from an Array',
    problem: 'Given an array with repeated values, return a new array with only unique values.',
    code: `function removeDuplicates(arr) {
  return [...new Set(arr)];
}

console.log(removeDuplicates([1, 2, 2, 3, 3, 4]));
// [1, 2, 3, 4]`,
    notes: 'Set stores only unique values automatically. Spread (...) turns the Set back into a plain array.'
  },
  {
    title: 'Word Frequency Count',
    problem: 'Given a sentence, count how many times each word appears.',
    code: `function wordCount(str) {
  const words = str.toLowerCase().split(' ');
  const count = {};
  for (const w of words) {
    count[w] = (count[w] || 0) + 1;
  }
  return count;
}

console.log(wordCount('the cat sat on the mat'));
// { the: 2, cat: 1, sat: 1, on: 1, mat: 1 }`,
    notes: '(count[w] || 0) + 1 is the key trick — if word not seen yet, start at 0, then add 1.'
  },
  {
    title: 'Palindrome Check',
    problem: 'Check whether a given string reads the same forwards and backwards (ignore case, spaces, punctuation).',
    code: `function isPalindrome(str) {
  const clean = str.toLowerCase().replace(/[^a-z0-9]/g, '');
  return clean === clean.split('').reverse().join('');
}

console.log(isPalindrome('A man a plan a canal Panama')); // true`,
    notes: 'replace(/[^a-z0-9]/g, "") strips everything that is not a letter or digit before comparing.'
  },
  {
    title: 'Reverse a String',
    problem: 'Reverse "hello" to "olleh".',
    code: `function reverseString(str) {
  return str.split('').reverse().join('');
}

console.log(reverseString('hello'));
// olleh`,
    notes: 'split("") → array of characters, reverse() → flips order, join("") → back to string.'
  },
  {
    title: 'Async/Await — Fetch User',
    problem: 'Fetch user data from an API and print the result, handling errors.',
    code: `async function getUser() {
  try {
    const response = await fetch('https://api.example.com/user');
    const data = await response.json();
    console.log(data);
  } catch (error) {
    console.log('Error:', error);
  }
}

getUser();`,
    notes: 'async marks a function as asynchronous. await pauses until the Promise resolves. Always wrap in try/catch.'
  },
  {
    title: 'Promise — Delayed Data',
    problem: 'Return "Data received" after a 2 second delay using a Promise.',
    code: `function getData() {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve('Data received');
    }, 2000);
  });
}

getData().then((data) => {
  console.log(data);
});`,
    notes: 'resolve() = success path, reject() = error path. .then() runs once resolve() fires.'
  },
  {
    title: 'Callback Pattern',
    problem: 'Run a second function only after the first one finishes.',
    code: `function getUser(callback) {
  setTimeout(() => {
    callback('User found');
  }, 1000);
}

getUser((message) => {
  console.log(message);
});`,
    notes: 'Callback = a function passed as an argument, called later once the async work is done.'
  },
  {
    title: 'Sequential vs Parallel Async Calls',
    problem: 'Show the difference between running two async calls one after another vs at the same time.',
    code: `// Sequential — waits for A, then starts B (slower)
async function sequential() {
  const a = await fetchData('a');
  const b = await fetchData('b');
  return [a, b];
}

// Parallel — both start together (faster)
async function parallel() {
  const [a, b] = await Promise.all([
    fetchData('a'),
    fetchData('b')
  ]);
  return [a, b];
}

function fetchData(id) {
  return new Promise((resolve) =>
    setTimeout(() => resolve(id + ' done'), 1000)
  );
}`,
    notes: 'Use Promise.all() when calls do not depend on each other — cuts total wait time.'
  },
  {
    title: 'Express — GET Route',
    problem: 'Build a /users route that returns a list of users as JSON.',
    code: `const express = require('express');
const app = express();

app.get('/users', (req, res) => {
  res.json([
    { id: 1, name: 'Reehan' },
    { id: 2, name: 'Rahul' }
  ]);
});

app.listen(3000, () => {
  console.log('Server running');
});`,
    notes: 'app.get/post/put/delete map directly to HTTP methods. res.json() sends the response as JSON.'
  },
  {
    title: 'Express — POST Route (Create User)',
    problem: 'Build a POST /users route that creates a user from the request body.',
    code: `const express = require('express');
const app = express();
app.use(express.json());

app.post('/users', (req, res) => {
  const user = req.body;
  res.status(201).json({
    message: 'User created',
    user
  });
});

app.listen(3000);`,
    notes: 'express.json() is required to read JSON sent in the request body — without it, req.body is undefined.'
  },
  {
    title: 'Middleware — Request Logger',
    problem: 'Log the method and URL of every incoming request.',
    code: `const logger = (req, res, next) => {
  console.log(req.method, req.url);
  next();
};

app.use(logger);`,
    notes: 'A middleware runs between the request and the response. Forgetting next() hangs the request forever.'
  },
  {
    title: 'Error Handling in a Route',
    problem: 'Properly catch and respond to an error inside an API route.',
    code: `app.get('/user', async (req, res) => {
  try {
    throw new Error('User not found');
  } catch (error) {
    res.status(500).json({
      message: error.message
    });
  }
});`,
    notes: 'Never let an error crash the server silently — always send a meaningful status code + message back.'
  },
  {
    title: 'req.params vs req.query vs req.body',
    problem: 'Get a user ID from the URL /users/25.',
    code: `app.get('/users/:id', (req, res) => {
  const id = req.params.id;
  res.json({ userId: id });
});

// req.params → URL path params (/users/:id)
// req.query  → query string (?search=value)
// req.body   → data sent in POST/PUT`,
    notes: 'One of the most commonly asked Node questions — know this cold.'
  },
  {
    title: 'JWT — Generate a Token',
    problem: 'Generate a signed JWT token after a user logs in.',
    code: `const jwt = require('jsonwebtoken');

const token = jwt.sign(
  { userId: 123 },
  process.env.JWT_SECRET,
  { expiresIn: '1h' }
);

console.log(token);`,
    notes: 'jwt.sign() creates a token, jwt.verify() checks one. Never hardcode the secret — use an environment variable.'
  },
  {
    title: 'Filter Even Numbers',
    problem: 'From an array of numbers, return only the even ones.',
    code: `const numbers = [1, 2, 3, 4, 5, 6];

const result = numbers.filter(num => num % 2 === 0);

console.log(result);
// [2, 4, 6]`,
    notes: 'filter() keeps only the elements where the callback returns true.'
  },
  {
    title: 'Filter Objects by Condition',
    problem: 'From a list of users, return only those older than 18.',
    code: `const users = [
  { name: 'A', age: 15 },
  { name: 'B', age: 22 },
  { name: 'C', age: 30 }
];

const adults = users.filter(user => user.age > 18);

console.log(adults);
// [{ name: 'B', age: 22 }, { name: 'C', age: 30 }]`,
    notes: 'Same filter() pattern, just checking a property on each object instead of the raw value.'
  },
  {
    title: 'Event Loop — Why This Order?',
    problem: 'Explain why this code logs "1, 4, 3, 2" instead of "1, 2, 3, 4".',
    code: `console.log('1');

setTimeout(() => console.log('2'), 0);

Promise.resolve().then(() => console.log('3'));

console.log('4');

// Output: 1, 4, 3, 2`,
    notes: 'Sync code runs first (1, 4). Then microtasks — Promises (3). Then macrotasks — setTimeout (2), even with 0ms delay.'
  },
  {
    title: 'let vs const vs var',
    problem: 'Explain the difference and show why var can cause bugs.',
    code: `for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 100);
}
// logs 3, 3, 3 — var is function-scoped, shared by all callbacks

for (let j = 0; j < 3; j++) {
  setTimeout(() => console.log(j), 100);
}
// logs 0, 1, 2 — let is block-scoped, each loop gets its own j`,
    notes: 'const = cannot be reassigned. let = block-scoped, reassignable. var = function-scoped, avoid it in modern code.'
  },
  {
    title: '== vs ===',
    problem: 'Explain the difference between loose and strict equality.',
    code: `console.log(1 == '1');   // true  — converts types before comparing
console.log(1 === '1');  // false — no type conversion, must match exactly

console.log(null == undefined);   // true
console.log(null === undefined);  // false`,
    notes: 'Always prefer === in real code — it avoids surprising type-coercion bugs.'
  },
  {
    title: 'Closures',
    problem: 'Write a function that returns a counter which remembers its own count.',
    code: `function createCounter() {
  let count = 0;
  return function () {
    count++;
    return count;
  };
}

const counter = createCounter();
console.log(counter()); // 1
console.log(counter()); // 2`,
    notes: 'A closure is a function that "remembers" variables from the scope it was created in, even after that scope has finished running.'
  },
  {
    title: 'Higher-Order Functions',
    problem: 'Write a function that takes another function as an argument and applies it to every array element.',
    code: `function applyToAll(arr, fn) {
  return arr.map(fn);
}

console.log(applyToAll([1, 2, 3], (n) => n * 2));
// [2, 4, 6]`,
    notes: 'A higher-order function either takes a function as an argument or returns one. map/filter/reduce are all built-in examples.'
  },
  {
    title: 'Array reduce() — Sum of Values',
    problem: 'Sum all numbers in an array using reduce().',
    code: `const numbers = [1, 2, 3, 4, 5];

const total = numbers.reduce((sum, n) => sum + n, 0);

console.log(total); // 15`,
    notes: 'reduce(callback, initialValue) — the callback runs once per element, carrying an accumulator forward.'
  },
  {
    title: 'Debounce Function',
    problem: 'Write a debounce function that delays running a function until the user has stopped triggering it.',
    code: `function debounce(fn, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const search = debounce((query) => console.log('Searching:', query), 300);
search('a');
search('ab');
search('abc'); // only this one actually runs, after 300ms`,
    notes: 'Common for search boxes — avoids firing an API call on every single keystroke.'
  },
  {
    title: 'Deep Clone an Object',
    problem: 'Create a true copy of a nested object so editing the copy does not affect the original.',
    code: `const original = { name: 'Reehan', address: { city: 'Belagavi' } };

const shallow = { ...original };           // nested objects still shared!
const deep = JSON.parse(JSON.stringify(original)); // safe for simple data
// or, in modern environments:
const deep2 = structuredClone(original);`,
    notes: 'Spread (...) only copies one level deep. JSON trick or structuredClone() copies everything, but JSON loses functions/dates.'
  },
  {
    title: 'CommonJS — module.exports / require',
    problem: 'Export a function from one file and use it in another.',
    code: `// math.js
function add(a, b) {
  return a + b;
}
module.exports = { add };

// app.js
const { add } = require('./math');
console.log(add(2, 3)); // 5`,
    notes: 'module.exports defines what a file shares. require() pulls it into another file. This is Node\'s original module system (CommonJS).'
  },
  {
    title: 'Read a File (fs module)',
    problem: 'Read a text file asynchronously without blocking the server.',
    code: `const fs = require('fs');

fs.readFile('data.txt', 'utf8', (err, data) => {
  if (err) {
    console.log('Error:', err);
    return;
  }
  console.log(data);
});`,
    notes: 'The callback runs once the file is read — the rest of the server keeps running in the meantime (non-blocking I/O).'
  },
  {
    title: 'Environment Variables (dotenv)',
    problem: 'Keep secrets like API keys out of your code using environment variables.',
    code: `// .env file
// PORT=3000
// DB_URL=mongodb://localhost/mydb

require('dotenv').config();

const port = process.env.PORT;
console.log('Server will run on', port);`,
    notes: 'Never commit a .env file to GitHub — add it to .gitignore. process.env is how Node reads them.'
  },
  {
    title: 'Enable CORS in Express',
    problem: 'Allow a frontend on a different domain/port to call your API.',
    code: `const express = require('express');
const cors = require('cors');
const app = express();

app.use(cors());

app.get('/data', (req, res) => {
  res.json({ message: 'CORS enabled' });
});`,
    notes: 'Without CORS, browsers block requests from a different origin (e.g. localhost:3000 → localhost:5000) by default.'
  },
  {
    title: 'PUT vs PATCH',
    problem: 'Explain the difference between the two HTTP methods.',
    code: `// PUT — replaces the ENTIRE resource
app.put('/users/:id', (req, res) => {
  // expects the full user object in req.body
});

// PATCH — updates only PART of the resource
app.patch('/users/:id', (req, res) => {
  // expects only the fields that changed
});`,
    notes: 'PUT = full replace. PATCH = partial update. A commonly confused REST question.'
  },
  {
    title: 'Flatten a Nested Array',
    problem: 'Turn [1, [2, 3], [4, [5, 6]]] into a single flat array.',
    code: `const nested = [1, [2, 3], [4, [5, 6]]];

const flat = nested.flat(Infinity);

console.log(flat);
// [1, 2, 3, 4, 5, 6]`,
    notes: 'flat(Infinity) flattens no matter how deeply nested the array is. flat() alone only goes one level deep.'
  },
  {
    title: 'Sort an Array of Objects',
    problem: 'Sort a list of users by age, youngest first.',
    code: `const users = [
  { name: 'A', age: 30 },
  { name: 'B', age: 15 },
  { name: 'C', age: 22 }
];

users.sort((a, b) => a.age - b.age);

console.log(users);
// B (15), C (22), A (30)`,
    notes: 'sort()\'s compare function: negative → a comes first, positive → b comes first. a.age - b.age gives ascending order.'
  }
];

const reactQuestions = [
  {
    title: 'Basic Component + Props',
    problem: 'Create a component that greets a user by name, passed in from the parent.',
    code: `function App() {
  return <User name="Reehan" />;
}

function User({ name }) {
  return <h1>Hello {name}</h1>;
}`,
    notes: 'Props flow one direction: parent → child. Destructure them straight in the function signature.'
  },
  {
    title: 'useState — Counter',
    problem: 'Build a counter with increment and decrement buttons.',
    code: `import { useState } from 'react';

function Counter() {
  const [count, setCount] = useState(0);

  return (
    <>
      <p>Count: {count}</p>
      <button onClick={() => setCount(count + 1)}>+</button>
      <button onClick={() => setCount(count - 1)}>-</button>
    </>
  );
}`,
    notes: 'count is the current value, setCount is the only correct way to update it and trigger a re-render.'
  },
  {
    title: 'Controlled Form Input',
    problem: 'Keep a text input in sync with component state as the user types.',
    code: `import { useState } from 'react';

function NameForm() {
  const [name, setName] = useState('');

  return (
    <input
      value={name}
      onChange={(e) => setName(e.target.value)}
    />
  );
}`,
    notes: 'A "controlled" input means React state — not the DOM — is the single source of truth for the value.'
  },
  {
    title: 'Form Submit Handling',
    problem: 'Take a username from an input and log it on submit.',
    code: `import { useState } from 'react';

function Form() {
  const [name, setName] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    console.log(name);
  };

  return (
    <form onSubmit={handleSubmit}>
      <input value={name} onChange={(e) => setName(e.target.value)} />
      <button type="submit">Submit</button>
    </form>
  );
}`,
    notes: 'e.preventDefault() stops the default full-page reload a native form submit would otherwise trigger.'
  },
  {
    title: 'List Rendering with Key',
    problem: 'Render a list of products.',
    code: `const products = [
  { id: 1, name: 'Laptop' },
  { id: 2, name: 'Phone' }
];

function Products() {
  return (
    <div>
      {products.map(product => (
        <p key={product.id}>{product.name}</p>
      ))}
    </div>
  );
}`,
    notes: 'key must be unique and stable (use an id, never the array index if the list can reorder).'
  },
  {
    title: 'Search / Filter a List',
    problem: 'Let the user type in a search box and filter a list live.',
    code: `import { useState } from 'react';

function SearchFilter({ items }) {
  const [query, setQuery] = useState('');

  const filtered = items.filter(item =>
    item.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <>
      <input value={query} onChange={(e) => setQuery(e.target.value)} />
      <ul>
        {filtered.map((item, i) => <li key={i}>{item}</li>)}
      </ul>
    </>
  );
}`,
    notes: 'No submit button needed — every keystroke updates query, which re-runs filter() on render.'
  },
  {
    title: 'useEffect — Fetch on Mount',
    problem: 'Call an API once, right when the component first loads.',
    code: `import { useEffect } from 'react';

function Users() {
  useEffect(() => {
    fetch('/api/users')
      .then(res => res.json())
      .then(data => console.log(data));
  }, []);

  return <h1>Users</h1>;
}`,
    notes: 'An empty dependency array [] means the effect runs once, right after the first render.'
  },
  {
    title: 'API Fetch + Display List',
    problem: 'Fetch a list of users and render them, with a loading state.',
    code: `import { useEffect, useState } from 'react';

function Users() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('/api/users')
      .then(res => res.json())
      .then(data => {
        setUsers(data);
        setLoading(false);
      });
  }, []);

  if (loading) return <p>Loading...</p>;

  return (
    <div>
      {users.map(user => <p key={user.id}>{user.name}</p>)}
    </div>
  );
}`,
    notes: 'This combines useState + useEffect + map() — the single most common React interview pattern.'
  },
  {
    title: 'Event Handling',
    problem: 'Show a message when a button is clicked.',
    code: `function App() {
  const handleClick = () => {
    alert('Button clicked');
  };

  return <button onClick={handleClick}>Click</button>;
}

// Correct:   onClick={handleClick}
// Wrong:     onClick={handleClick()}  <- runs immediately on render`,
    notes: 'Pass the function reference, not the result of calling it — a very common beginner bug.'
  },
  {
    title: 'Conditional Rendering',
    problem: 'Show a Dashboard if logged in, otherwise show a Login prompt.',
    code: `function App({ isLoggedIn }) {
  return (
    <div>
      {isLoggedIn ? <h1>Dashboard</h1> : <h1>Please Login</h1>}
    </div>
  );
}`,
    notes: 'The ternary (condition ? a : b) is the standard way to branch inside JSX.'
  },
  {
    title: 'useMemo — Performance',
    problem: 'Avoid re-running an expensive calculation on every render.',
    code: `import { useMemo } from 'react';

const result = useMemo(() => {
  return expensiveCalculation(value);
}, [value]);`,
    notes: 'useMemo caches the result and only recalculates when a value in the dependency array actually changes.'
  },
  {
    title: 'useRef — Focus an Input',
    problem: 'Automatically focus a text input when a button is clicked.',
    code: `import { useRef } from 'react';

function SearchBox() {
  const inputRef = useRef(null);

  const focusInput = () => {
    inputRef.current.focus();
  };

  return (
    <>
      <input ref={inputRef} type="text" />
      <button onClick={focusInput}>Focus</button>
    </>
  );
}`,
    notes: 'useRef gives direct access to a DOM element without causing a re-render — unlike state, updating a ref does not trigger a render.'
  },
  {
    title: 'useContext — Share Data Without Prop Drilling',
    problem: 'Share a theme value with deeply nested components without passing props at every level.',
    code: `import { createContext, useContext } from 'react';

const ThemeContext = createContext('light');

function App() {
  return (
    <ThemeContext.Provider value="dark">
      <Toolbar />
    </ThemeContext.Provider>
  );
}

function Toolbar() {
  const theme = useContext(ThemeContext);
  return <p>Current theme: {theme}</p>;
}`,
    notes: 'Context avoids "prop drilling" — passing a prop through many layers that do not actually need it themselves.'
  },
  {
    title: 'Custom Hook — useFetch',
    problem: 'Extract repeated fetch + loading logic into a reusable custom hook.',
    code: `import { useState, useEffect } from 'react';

function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch(url)
      .then(res => res.json())
      .then(json => {
        setData(json);
        setLoading(false);
      });
  }, [url]);

  return { data, loading };
}

// usage
function Users() {
  const { data, loading } = useFetch('/api/users');
  if (loading) return <p>Loading...</p>;
  return <p>{data.length} users found</p>;
}`,
    notes: 'A custom hook is just a function starting with "use" that reuses stateful logic across components.'
  },
  {
    title: 'useReducer — Complex State',
    problem: 'Manage state with multiple related actions using useReducer instead of several useState calls.',
    code: `import { useReducer } from 'react';

function reducer(state, action) {
  switch (action.type) {
    case 'increment': return { count: state.count + 1 };
    case 'decrement': return { count: state.count - 1 };
    default: return state;
  }
}

function Counter() {
  const [state, dispatch] = useReducer(reducer, { count: 0 });

  return (
    <>
      <p>{state.count}</p>
      <button onClick={() => dispatch({ type: 'increment' })}>+</button>
      <button onClick={() => dispatch({ type: 'decrement' })}>-</button>
    </>
  );
}`,
    notes: 'Prefer useReducer over useState when state logic gets complex, or the next state depends on the previous one in several ways.'
  },
  {
    title: 'Lifting State Up',
    problem: 'Two sibling components need to share the same value — how do they stay in sync?',
    code: `function Parent() {
  const [value, setValue] = useState('');

  return (
    <>
      <InputBox value={value} onChange={setValue} />
      <Preview value={value} />
    </>
  );
}

function InputBox({ value, onChange }) {
  return <input value={value} onChange={(e) => onChange(e.target.value)} />;
}

function Preview({ value }) {
  return <p>You typed: {value}</p>;
}`,
    notes: 'Move the shared state up to the closest common parent, then pass it down as props — this is "lifting state up."'
  },
  {
    title: 'React.memo — Skip Unnecessary Re-renders',
    problem: 'Prevent a child component from re-rendering when its props have not changed.',
    code: `const ProductCard = React.memo(function ProductCard({ name, price }) {
  console.log('Rendering:', name);
  return <div>{name} - ₹{price}</div>;
});`,
    notes: 'React.memo does a shallow comparison of props — if nothing changed, it skips re-rendering that component.'
  },
  {
    title: 'Debounced Search Input',
    problem: 'Wait until the user stops typing before firing a search API call.',
    code: `import { useState, useEffect } from 'react';

function Search() {
  const [query, setQuery] = useState('');

  useEffect(() => {
    const timer = setTimeout(() => {
      if (query) console.log('Searching for:', query);
    }, 500);

    return () => clearTimeout(timer); // cleanup on every keystroke
  }, [query]);

  return <input value={query} onChange={(e) => setQuery(e.target.value)} />;
}`,
    notes: 'The cleanup function (return () => ...) cancels the previous timer every time query changes, so only the last keystroke fires the search.'
  },
  {
    title: 'Error Boundary',
    problem: 'Catch a rendering error in a component tree so the whole app does not crash.',
    code: `class ErrorBoundary extends React.Component {
  state = { hasError: false };

  static getDerivedStateFromError() {
    return { hasError: true };
  }

  render() {
    if (this.state.hasError) {
      return <h2>Something went wrong.</h2>;
    }
    return this.props.children;
  }
}

// usage
<ErrorBoundary>
  <BuggyComponent />
</ErrorBoundary>`,
    notes: 'Error boundaries must be class components (no hook equivalent yet). They catch errors thrown anywhere below them in the tree.'
  },
  {
    title: 'Conditional className',
    problem: 'Apply an "active" CSS class only when a condition is true.',
    code: `function Tab({ isActive, label }) {
  return (
    <button className={\`tab \${isActive ? 'tab-active' : ''}\`}>
      {label}
    </button>
  );
}`,
    notes: 'Template literals make it easy to build conditional class strings without a library.'
  },
  {
    title: 'React.lazy + Suspense — Code Splitting',
    problem: 'Load a heavy component only when it is actually needed, not on initial page load.',
    code: `import { lazy, Suspense } from 'react';

const Settings = lazy(() => import('./Settings'));

function App() {
  return (
    <Suspense fallback={<p>Loading...</p>}>
      <Settings />
    </Suspense>
  );
}`,
    notes: 'lazy() splits that component into a separate bundle, downloaded only when it renders. Suspense shows a fallback while it loads.'
  },
  {
    title: 'PropTypes / Default Props',
    problem: 'Validate the props a component receives and give one a default value.',
    code: `import PropTypes from 'prop-types';

function User({ name, age }) {
  return <p>{name} is {age} years old</p>;
}

User.propTypes = {
  name: PropTypes.string.isRequired,
  age: PropTypes.number
};

User.defaultProps = {
  age: 18
};`,
    notes: 'PropTypes catches wrong prop types in development with a console warning — it does not stop the app, just warns.'
  }
];

const cheatSheet = [
  ['Props', 'Data passed from a parent component down to a child.'],
  ['State', "A component's own internal, changeable data."],
  ['useState', 'Hook to declare and update state in a function component.'],
  ['useEffect', 'Hook for side effects — API calls, subscriptions, timers.'],
  ['useRef', 'Hook to reference a DOM node or store a value without re-rendering.'],
  ['useContext', 'Hook to read a value from Context without prop drilling.'],
  ['useReducer', 'Hook for state logic with multiple related actions.'],
  ['map()', 'Transforms every item in an array into something new.'],
  ['filter()', 'Returns only the array elements that match a condition.'],
  ['reduce()', 'Folds an array down into a single accumulated value.'],
  ['Closure', 'A function that remembers variables from where it was created.'],
  ['Middleware', 'A function that runs between an incoming request and the final response.'],
  ['req.body', 'Data sent in a POST/PUT request body.'],
  ['req.params', 'Dynamic values captured from the URL path (/users/:id).'],
  ['req.query', 'Values from the query string (?search=value).'],
  ['JWT', 'A signed token used to authenticate a user across requests.'],
  ['Promise', "An object representing the eventual result of an async operation."],
  ['async / await', 'Cleaner syntax for working with Promises.'],
  ['Event Loop', 'What lets Node run non-blocking I/O on a single thread.'],
  ['CORS', 'Browser security rule controlling cross-origin requests.'],
  ['Express', 'A minimal web framework for building APIs in Node.js.'],
  ['res.json()', 'Sends a JSON response from an Express route.'],
  ['React Fragment', 'Groups elements without adding an extra DOM node (<>...</>).'],
  ['React.memo', 'Skips re-rendering a component if its props are unchanged.'],
  ['Error Boundary', 'A class component that catches render errors in its children.'],
  ['debounce', 'Delays a function call until activity has paused for a bit.'],
];

/* ============ STATE ============ */
const doneSet = new Set();
let currentView = 'node';
let currentIndex = 0;
let searchTerm = '';

/* ============ BOOT SEQUENCE ============ */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('boot').style.transition = 'opacity 0.4s';
    document.getElementById('boot').style.opacity = '0';
    document.getElementById('app').style.opacity = '1';
    setTimeout(() => document.getElementById('boot').remove(), 450);
  }, 550);
});

/* ============ HELPERS ============ */
function activeList() {
  const list = currentView === 'react' ? reactQuestions : nodeQuestions;
  if (!searchTerm) return list;
  return list.filter(q =>
    q.title.toLowerCase().includes(searchTerm) ||
    q.problem.toLowerCase().includes(searchTerm)
  );
}

function qKey(view, idx) { return view + '-' + idx; }
function totalCount() { return nodeQuestions.length + reactQuestions.length; }

function updateProgress() {
  const total = totalCount();
  const done = doneSet.size;
  document.getElementById('progressText').textContent = done + ' / ' + total;
  document.getElementById('progressBar').style.width = (total ? (done / total) * 100 : 0) + '%';
}

/* ============ RENDER: SIDEBAR ============ */
function renderList() {
  const nav = document.getElementById('questionList');
  nav.innerHTML = '';

  document.querySelectorAll('.round-tab').forEach(btn => {
    const active = btn.dataset.view === currentView;
    btn.classList.toggle('bg-amber', active);
    btn.classList.toggle('text-white', active);
    btn.classList.toggle('border-amber', active);
    btn.classList.toggle('font-semibold', active);
    btn.classList.toggle('text-ink', !active);
  });

  if (currentView === 'sheet') {
    nav.innerHTML = '<p class="text-xs text-muted font-mono px-1 leading-relaxed">Quick revision table — flip each card to check yourself.</p>';
    return;
  }

  const list = activeList();
  const fullList = currentView === 'react' ? reactQuestions : nodeQuestions;

  if (list.length === 0) {
    nav.innerHTML = '<p class="text-sm text-muted font-mono px-1">No matches.</p>';
    return;
  }

  list.forEach((q) => {
    const realIdx = fullList.indexOf(q);
    const key = qKey(currentView, realIdx);
    const isDone = doneSet.has(key);
    const isActive = realIdx === currentIndex;

    const item = document.createElement('button');
    item.className = 'side-item shrink-0 md:w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-line bg-white hover:border-amber/60 transition-colors' + (isActive ? ' active' : '') + (isDone ? ' is-done' : '');
    item.innerHTML = `
      <span class="num-badge shrink-0 w-6 h-6 rounded flex items-center justify-center text-[11px] font-mono font-semibold border border-line text-muted">${isDone ? '✓' : String(realIdx + 1).padStart(2, '0')}</span>
      <span class="text-xs sm:text-[13px] leading-snug whitespace-nowrap md:whitespace-normal ${isDone ? 'text-muted' : 'text-ink'}">${q.title}</span>
    `;
    item.addEventListener('click', () => {
      currentIndex = realIdx;
      renderList();
      renderMain();
    });
    nav.appendChild(item);
  });
}

/* ============ RENDER: MAIN ============ */
function renderMain() {
  const main = document.getElementById('mainPanel');

  if (currentView === 'sheet') {
    renderSheet(main);
    return;
  }

  const fullList = currentView === 'react' ? reactQuestions : nodeQuestions;
  const q = fullList[currentIndex];
  if (!q) {
    main.innerHTML = '<p class="text-muted font-mono text-sm">Select a question from the list.</p>';
    return;
  }
  const key = qKey(currentView, currentIndex);
  const isDone = doneSet.has(key);

  main.innerHTML = `
    <div class="bg-white border border-line rounded-2xl p-5 sm:p-7 shadow-sm">
      <div class="flex items-start justify-between gap-4 mb-4">
        <div>
          <p class="font-mono text-xs text-amber tracking-widest mb-1.5">${currentView === 'react' ? 'REACT.JS' : 'NODE.JS'} — Q${String(currentIndex + 1).padStart(2, '0')}</p>
          <h2 class="text-lg sm:text-xl font-semibold text-ink">${q.title}</h2>
        </div>
        <button id="doneToggle" class="shrink-0 font-mono text-xs px-3 py-2 rounded-lg border transition-colors ${isDone ? 'border-done text-done bg-doneSoft' : 'border-line text-muted hover:border-amber hover:text-amber'}">
          ${isDone ? '✓ Done' : 'Mark done'}
        </button>
      </div>

      <p class="text-sm sm:text-[15px] text-ink/90 leading-relaxed mb-5">${q.problem}</p>

      <div class="mb-4">
        <button id="revealBtn" class="font-mono text-xs px-4 py-2.5 rounded-lg bg-amber text-white font-semibold hover:bg-amber/90 transition-colors">
          Show answer
        </button>
      </div>

      <div id="answerBlock" class="hidden">
        <div class="code-shell rounded-xl overflow-hidden">
          <div class="flex items-center justify-between px-4 py-2 border-b border-line">
            <span class="text-[11px] font-mono text-muted">solution.js</span>
            <button id="copyBtn" class="text-[11px] font-mono text-muted hover:text-amber transition-colors">Copy</button>
          </div>
          <pre class="p-4 overflow-x-auto"><code class="language-javascript" id="codeBlock"></code></pre>
        </div>
        <div class="mt-3 flex gap-2.5 bg-amberSoft border border-amber/25 rounded-lg px-4 py-3">
          <span class="text-amber font-mono text-xs shrink-0 mt-0.5">note</span>
          <p class="text-xs sm:text-[13px] text-ink/70 leading-relaxed">${q.notes}</p>
        </div>
      </div>

      <div class="flex items-center justify-between mt-6 pt-5 border-t border-line">
        <button id="prevBtn" class="font-mono text-xs px-3 py-2 rounded-lg border border-line text-muted hover:text-ink hover:border-ink/30 transition-colors disabled:opacity-30" ${currentIndex === 0 ? 'disabled' : ''}>&larr; Prev</button>
        <span class="font-mono text-xs text-muted">${currentIndex + 1} of ${fullList.length}</span>
        <button id="nextBtn" class="font-mono text-xs px-3 py-2 rounded-lg border border-line text-muted hover:text-ink hover:border-ink/30 transition-colors disabled:opacity-30" ${currentIndex === fullList.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
      </div>
    </div>
  `;

  document.getElementById('codeBlock').textContent = q.code;

  document.getElementById('revealBtn').addEventListener('click', () => {
    const block = document.getElementById('answerBlock');
    block.classList.toggle('hidden');
    hljs.highlightElement(document.getElementById('codeBlock'));
  });

  document.getElementById('copyBtn').addEventListener('click', (e) => {
    navigator.clipboard.writeText(q.code);
    e.target.textContent = 'Copied!';
    setTimeout(() => { e.target.textContent = 'Copy'; }, 1200);
  });

  document.getElementById('doneToggle').addEventListener('click', () => {
    if (doneSet.has(key)) doneSet.delete(key); else doneSet.add(key);
    updateProgress();
    renderList();
    renderMain();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; renderList(); renderMain(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < fullList.length - 1) { currentIndex++; renderList(); renderMain(); }
  });
}

function renderSheet(main) {
  main.innerHTML = `
    <div class="mb-5">
      <p class="font-mono text-xs text-amber tracking-widest mb-1.5">CHEAT SHEET</p>
      <h2 class="text-lg sm:text-xl font-semibold text-ink">Last-minute revision — tap a card to flip</h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5" id="sheetGrid"></div>
  `;
  const grid = document.getElementById('sheetGrid');
  cheatSheet.forEach(([term, def]) => {
    const card = document.createElement('div');
    card.className = 'flip-card h-28 cursor-pointer';
    card.innerHTML = `
      <div class="flip-inner relative w-full h-full">
        <div class="flip-face absolute inset-0 bg-white border border-line rounded-xl flex items-center justify-center px-4 shadow-sm">
          <p class="font-mono text-sm font-semibold text-ink text-center">${term}</p>
        </div>
        <div class="flip-face flip-back absolute inset-0 bg-amberSoft border border-amber/30 rounded-xl flex items-center justify-center px-4">
          <p class="text-xs text-ink/70 text-center leading-relaxed">${def}</p>
        </div>
      </div>
    `;
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    grid.appendChild(card);
  });
}

/* ============ EVENTS ============ */
document.querySelectorAll('.round-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentView = btn.dataset.view;
    currentIndex = 0;
    searchTerm = '';
    document.getElementById('searchBox').value = '';
    renderList();
    renderMain();
  });
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase();
  renderList();
});

/* ============ TIMER ============ */
let timeLeft = 900;
let timerInterval = null;
let timerRunning = false;

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return m + ':' + sec;
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timeLeft);
  el.classList.toggle('text-red-500', timeLeft <= 60);
  el.classList.toggle('text-amber', timeLeft > 60);
}

document.getElementById('timerToggle').addEventListener('click', (e) => {
  timerRunning = !timerRunning;
  e.target.textContent = timerRunning ? 'Pause' : 'Start';
  if (timerRunning) {
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();
      } else {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timerToggle').textContent = 'Start';
        document.getElementById('timerDisplay').textContent = "Time's up";
      }
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
});

document.getElementById('timerReset').addEventListener('click', () => {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
  timeLeft = parseInt(document.getElementById('timerSelect').value, 10);
  updateTimerDisplay();
});

document.getElementById('timerSelect').addEventListener('change', (e) => {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
  timeLeft = parseInt(e.target.value, 10);
  updateTimerDisplay();
});

/* ============ INIT ============ */
renderList();
renderMain();
updateProgress();
updateTimerDisplay();
</script>
</body>
</html>
